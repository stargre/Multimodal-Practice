[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-practice-hybrid"
version = "0.1.0"
description = "HF phase-1 packaging of the qwen25_fork Qwen3/InternViT model"
requires-python = ">=3.10"
dependencies = ["transformers==4.57.6", "torch>=2.6", "safetensors>=0.4.3", "Pillow>=10", "timm>=1.0,<2", "einops>=0.7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["hybrid_vlm*"]

[tool.setuptools.package-data]
hybrid_vlm = ["LICENSE_InternVL", "THIRD_PARTY.md"]
